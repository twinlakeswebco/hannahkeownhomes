name: Update footer credit once

on:
  push:
    branches:
      - footer-credit-update

permissions:
  contents: write

jobs:
  update-footer-credit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update footer credit sitewide
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          credit_text = 'Website by <a href="mailto:me@caseykeown.com">Twin Lakes Web Co. LLC</a>'
          site_credit = f'<div class="footer-credit-global">{credit_text}</div>'
          standalone_credit = f'<footer class="standalone-credit">{credit_text}</footer>'
          inline_credit = f'<footer class="credit" style="text-align:center;padding:24px;font:500 13px system-ui,sans-serif;color:#4a5c6e">Website by <a style="color:inherit;font-weight:600" href="mailto:me@caseykeown.com">Twin Lakes Web Co. LLC</a></footer>'
          not_found_credit = '<footer class="credit" style="position:fixed;left:0;right:0;bottom:12px;text-align:center;font:500 12px system-ui,sans-serif;color:rgba(255,255,255,.72)">Website by <a style="color:inherit;font-weight:600" href="mailto:me@caseykeown.com">Twin Lakes Web Co. LLC</a></footer>'

          for path in sorted(Path('.').rglob('*.html')):
              if 'admin' in path.parts or '.github' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')

              # Normalize any existing website-credit markup.
              text = re.sub(r'<div class="footer-credit-line">.*?</div>', site_credit, text, flags=re.S)
              text = re.sub(r'<div class="footer-credit-global">.*?</div>', site_credit, text, flags=re.S)
              text = re.sub(r'<footer class="credit"[^>]*>.*?</footer>', inline_credit if str(path) in {'privacy/index.html','accessibility/index.html'} else f'<footer class="credit">{credit_text}</footer>', text, flags=re.S)
              text = re.sub(r'<footer class="standalone-credit">.*?</footer>', standalone_credit, text, flags=re.S)

              # Add a credit where the page does not already have one.
              if 'Twin Lakes Web Co. LLC' not in text:
                  if '<footer class="site-footer">' in text:
                      text = text.replace('</footer>', site_credit + '</footer>', 1)
                  elif str(path) == '404.html':
                      text = text.replace('</body>', not_found_credit + '</body>')
                  elif str(path) in {'privacy/index.html','accessibility/index.html'}:
                      text = text.replace('</body>', inline_credit + '</body>')
                  else:
                      text = text.replace('</body>', standalone_credit + '</body>')

              path.write_text(text, encoding='utf-8')

          css_path = Path('site.css')
          css = css_path.read_text(encoding='utf-8')
          if '.footer-credit-global' not in css:
              css += '\n.footer-credit-global{width:min(1180px,100%);margin:28px auto 0;padding:18px 28px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.7rem;color:rgba(255,255,255,.48);text-align:center}.footer-credit-global a{font-size:inherit;color:rgba(255,255,255,.68);text-decoration:none}.footer-credit-global a:hover{color:#fff}.standalone-credit{text-align:center;padding:28px 24px 44px;font-size:.7rem;color:var(--text-soft)}.standalone-credit a{font-size:inherit;font-weight:600;color:var(--steel);text-decoration:none}.standalone-credit a:hover{color:var(--navy)}\n'
              css_path.write_text(css, encoding='utf-8')

          # Remove this one-time workflow from the resulting commit.
          Path('.github/workflows/update-footer-credit-once.yml').unlink()
          PY

          git config user.name "Twin Lakes Web Co."
          git config user.email "me@caseykeown.com"
          git add -A
          git commit -m "Update website footer credit sitewide"
          git push origin HEAD:footer-credit-update
