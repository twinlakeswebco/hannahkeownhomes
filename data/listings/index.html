<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Listings | Hannah Keown, REALTOR®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #d8e2ec;
  --bg-mid: #cdd8e4;
  --bg-deep: #bccad8;
  --bg-white: #ffffff;
  --navy: #1c3557;
  --navy-mid: #2d4f7c;
  --navy-light: #3d6494;
  --steel: #4a7baa;
  --steel-light: #6b9cc4;
  --steel-pale: #a8c4dc;
  --gold: #b8963e;
  --pending: #b0703a;
  --text-dark: #1c3557;
  --text-mid: #3d5a7a;
  --text-soft: #6b85a0;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-pill: 100px;
  --shadow-sm: 0 2px 12px rgba(28,53,87,0.08);
  --shadow-md: 0 6px 28px rgba(28,53,87,0.12);
  --shadow-lg: 0 16px 56px rgba(28,53,87,0.18);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  font-family:var(--sans);
  color:var(--text-dark);
}
a{text-decoration:none;color:inherit;}

/* ---- Header ---- */
header.page-head{
  background:var(--navy);
  color:#fff;
  padding:72px 28px 52px;
  text-align:center;
}
.section-eyebrow{
  font-family:var(--sans);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:12px;
  color:var(--steel-light);
  margin-bottom:14px;
}
header.page-head h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(34px,5vw,52px);
  margin:0 0 12px;
}
header.page-head p{
  color:rgba(255,255,255,.72);
  font-size:15px;
  margin:0;
  max-width:560px;
  margin:0 auto;
}

/* ---- Toolbar ---- */
.toolbar-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:0 28px;
}
.toolbar{
  background:var(--bg-white);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  margin-top:-30px;
  padding:22px 26px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:16px;
  position:relative;
  z-index:2;
}
.field-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.field-group label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--text-soft);
  font-weight:600;
}
select{
  font-family:var(--sans);
  font-size:14px;
  font-weight:500;
  color:var(--navy);
  background:var(--bg);
  border:1px solid rgba(28,53,87,.12);
  border-radius:var(--radius-pill);
  padding:10px 36px 10px 18px;
  appearance:none;
  -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0' fill='none' stroke='%233d5a7a' stroke-width='1.5'/></svg>");
  background-repeat:no-repeat;
  background-position:right 16px center;
  cursor:pointer;
  min-width:190px;
  transition:border-color .2s;
}
select:hover{border-color:rgba(28,53,87,.28);}
select:focus{outline:2px solid var(--steel-pale);outline-offset:1px;}

.result-count{
  margin-left:auto;
  font-size:13px;
  color:var(--text-soft);
  font-weight:500;
}
.reset-link{
  font-size:13px;
  font-weight:600;
  color:var(--steel);
  border:none;
  background:none;
  cursor:pointer;
  padding:0;
}
.reset-link:hover{color:var(--navy);}

/* ---- Grid ---- */
.listings-section{
  max-width:1200px;
  margin:0 auto;
  padding:44px 28px 96px;
}
.listings-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}
@media (max-width:1080px){ .listings-grid{grid-template-columns:repeat(3,1fr);} }
@media (max-width:760px){ .listings-grid{grid-template-columns:repeat(2,1fr);} .toolbar{margin-top:-20px;} }
@media (max-width:520px){
  .listings-grid{grid-template-columns:1fr;}
  select{min-width:0;flex:1;}
  .toolbar{flex-direction:column;align-items:stretch;}
  .result-count{margin-left:0;text-align:center;}
}

.listing-card{
  position:relative;
  display:block;
  border-radius:var(--radius-lg);
  overflow:hidden;
  aspect-ratio:3/4;
  width:100%;
  box-shadow:var(--shadow-md);
  background:var(--bg-deep);
  transition:transform .3s, box-shadow .3s;
}
.listing-card.no-link{cursor:default;}
.listing-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);}
.listing-card img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;display:block;
  transition:transform .45s cubic-bezier(0.25,0.46,0.45,0.94);
}
.listing-card:hover img{transform:scale(1.04);}
.lc-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;font-family:var(--serif);font-size:1.2rem;
  color:var(--text-mid);background:linear-gradient(160deg,var(--bg-mid),var(--bg-deep));
}
.lc-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom, rgba(15,28,48,0) 0%, rgba(15,28,48,0.12) 38%, rgba(15,28,48,0.76) 100%);
  pointer-events:none;
}
.lc-badge{
  position:absolute;top:14px;left:14px;
  font-family:var(--sans);font-size:.58rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:#fff;
  border:1px solid rgba(255,255,255,.25);
  padding:4px 10px;border-radius:var(--radius-pill);backdrop-filter:blur(4px);
}
.lc-badge.status-active{background:rgba(74,123,170,.9);}
.lc-badge.status-pending{background:rgba(176,112,58,.9);}
.lc-badge.status-sold{background:rgba(184,150,62,.9);}

.lc-body{position:absolute;bottom:0;left:0;right:0;padding:20px 18px 18px;}
.lc-price{font-family:var(--serif);font-size:1.35rem;font-weight:500;color:#fff;line-height:1;margin-bottom:7px;}
.lc-accent{width:28px;height:1.5px;background:rgba(255,255,255,.45);border-radius:2px;margin-bottom:7px;}
.lc-address{font-family:var(--sans);font-size:.84rem;font-weight:600;color:#fff;line-height:1.25;margin-bottom:5px;}
.lc-location{font-family:var(--sans);font-size:.68rem;font-weight:400;color:rgba(255,255,255,.68);margin-bottom:2px;}
.lc-specs{font-family:var(--sans);font-size:.66rem;font-weight:400;color:rgba(255,255,255,.5);}

/* ---- Empty / error states ---- */
.empty-state{
  grid-column:1/-1;
  background:var(--bg-white);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  padding:64px 28px;
  text-align:center;
}
.empty-state h3{
  font-family:var(--serif);font-weight:600;font-size:1.6rem;color:var(--navy);margin:0 0 10px;
}
.empty-state p{color:var(--text-soft);font-size:14px;margin:0 0 18px;}
.btn-ghost{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--sans);font-size:.8rem;font-weight:600;letter-spacing:.03em;
  padding:12px 24px;border-radius:var(--radius-pill);
  background:transparent;color:var(--navy-mid);
  border:1.5px solid rgba(28,53,87,.25);cursor:pointer;transition:background .2s,border-color .2s;
}
.btn-ghost:hover{background:rgba(28,53,87,.06);border-color:rgba(28,53,87,.4);}

footer.credit{
  text-align:center;
  padding:0 24px 56px;
  font-size:13px;
  color:#4a5c6e;
}
footer.credit a{font-weight:500;color:var(--steel);text-decoration:underline;text-decoration-color:var(--steel-pale);}
footer.credit a:hover{color:var(--navy);}
</style>
</head>
<body>

<header class="page-head">
  <div class="section-eyebrow">Hardin · Grayson · Breckinridge · Meade</div>
  <h1>Current Listings</h1>
  <p>Browse active, pending, and recently sold properties across Central Kentucky.</p>
</header>

<div class="toolbar-wrap">
  <div class="toolbar">
    <div class="field-group">
      <label for="countyFilter">County</label>
      <select id="countyFilter">
        <option value="all">All Counties</option>
      </select>
    </div>
    <div class="field-group">
      <label for="sortSelect">Sort By</label>
      <select id="sortSelect">
        <option value="">Featured Order</option>
        <optgroup label="Price">
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </optgroup>
        <optgroup label="Bedrooms">
          <option value="beds-asc">Bedrooms: Low to High</option>
          <option value="beds-desc">Bedrooms: High to Low</option>
        </optgroup>
        <optgroup label="Square Footage">
          <option value="sqft-asc">Sqft: Low to High</option>
          <option value="sqft-desc">Sqft: High to Low</option>
        </optgroup>
      </select>
    </div>
    <button class="reset-link" id="resetBtn" type="button">Reset filters</button>
    <div class="result-count" id="resultCount"></div>
  </div>
</div>

<div class="listings-section">
  <div class="listings-grid" id="listingsGrid">
    <div class="empty-state"><h3>Loading listings…</h3></div>
  </div>
</div>

<footer class="credit">
  Website by <a href="mailto:me@caseykeown.com">Twin Lakes Web Co.</a>
</footer>

<script>
(function(){
  var DATA_URL = 'data/listings.json';
  var grid = document.getElementById('listingsGrid');
  var countySelect = document.getElementById('countyFilter');
  var sortSelect = document.getElementById('sortSelect');
  var resultCount = document.getElementById('resultCount');
  var resetBtn = document.getElementById('resetBtn');
  var allListings = [];
  var loadFailed = false;

  function parsePrice(v){
    if (typeof v === 'number') return v;
    var n = parseFloat(String(v || '').replace(/[^0-9.]/g, ''));
    return isNaN(n) ? 0 : n;
  }
  function num(v){
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }
  function statusClass(status){
    var s = String(status || '').toLowerCase();
    if (s === 'pending') return 'status-pending';
    if (s === 'sold') return 'status-sold';
    return 'status-active';
  }
  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function populateCounties(){
    var seen = {};
    var counties = [];
    allListings.forEach(function(l){
      var c = (l.county || '').trim();
      if (c && !seen[c.toLowerCase()]) {
        seen[c.toLowerCase()] = true;
        counties.push(c);
      }
    });
    counties.sort(function(a,b){ return a.localeCompare(b); });
    countySelect.innerHTML = '<option value="all">All Counties</option>' +
      counties.map(function(c){ return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
  }

  function cardHtml(l){
    var status = l.status || 'Active';
    var badgeClass = statusClass(status);
    var cityState = [l.city, l.state].filter(Boolean).join(', ');
    var countyLine = l.county ? (cityState ? cityState + ' — ' + l.county + ' County' : l.county + ' County') : cityState;
    var specs = [];
    if (l.beds != null && l.beds !== '') specs.push(l.beds + ' bd');
    if (l.baths != null && l.baths !== '') specs.push(l.baths + ' ba');
    if (l.sqft != null && l.sqft !== '') specs.push(Number(l.sqft).toLocaleString() + ' sqft');
    var tag = l.url ? 'a' : 'div';
    var hrefAttr = l.url ? ' href="' + esc(l.url) + '" target="_blank" rel="noopener"' : '';
    var linkClass = l.url ? '' : ' no-link';
    var imgBlock = l.image
      ? '<img src="' + esc(l.image) + '" alt="' + esc(l.address || 'Listing photo') + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<div class="lc-ph" style="display:none;">' + esc(l.address || 'Photo coming soon') + '</div>'
      : '<div class="lc-ph">' + esc(l.address || 'Photo coming soon') + '</div>';

    return '<' + tag + ' class="listing-card' + linkClass + '"' + hrefAttr + '>'
      + imgBlock
      + '<div class="lc-badge ' + badgeClass + '">' + esc(status) + '</div>'
      + '<div class="lc-overlay"></div>'
      + '<div class="lc-body">'
        + '<div class="lc-price">' + esc(l.price || '') + '</div>'
        + '<div class="lc-accent"></div>'
        + '<div class="lc-address">' + esc(l.address || '') + '</div>'
        + (countyLine ? '<div class="lc-location">' + esc(countyLine) + '</div>' : '')
        + (specs.length ? '<div class="lc-specs">' + esc(specs.join(' · ')) + '</div>' : '')
      + '</div>'
    + '</' + tag + '>';
  }

  function emptyStateHtml(){
    if (loadFailed) {
      return '<div class="empty-state"><h3>Listings are temporarily unavailable</h3>'
        + '<p>This page loads listing data directly from the site\'s repository. If you\'re viewing this file locally rather than on the live site, the browser blocks that request — check back once it\'s deployed.</p></div>';
    }
    if (allListings.length === 0) {
      return '<div class="empty-state"><h3>New listings coming soon</h3>'
        + '<p>Hannah is preparing new properties for this page. Check back shortly, or reach out directly for the latest availability.</p></div>';
    }
    return '<div class="empty-state"><h3>No listings match these filters</h3>'
      + '<p>Try a different county or clear your filters to see everything currently available.</p>'
      + '<button class="btn-ghost" onclick="document.getElementById(\'resetBtn\').click()">Reset filters</button></div>';
  }

  function render(){
    var countyVal = countySelect.value;
    var sortVal = sortSelect.value;

    var filtered = allListings.filter(function(l){
      if (countyVal === 'all') return true;
      return (l.county || '').trim().toLowerCase() === countyVal.toLowerCase();
    });

    var sorters = {
      'price-asc': function(a,b){ return parsePrice(a.price) - parsePrice(b.price); },
      'price-desc': function(a,b){ return parsePrice(b.price) - parsePrice(a.price); },
      'beds-asc': function(a,b){ return num(a.beds) - num(b.beds); },
      'beds-desc': function(a,b){ return num(b.beds) - num(a.beds); },
      'sqft-asc': function(a,b){ return num(a.sqft) - num(b.sqft); },
      'sqft-desc': function(a,b){ return num(b.sqft) - num(a.sqft); }
    };
    if (sorters[sortVal]) filtered = filtered.slice().sort(sorters[sortVal]);

    if (filtered.length === 0) {
      grid.innerHTML = emptyStateHtml();
    } else {
      grid.innerHTML = filtered.map(cardHtml).join('');
    }

    if (loadFailed) {
      resultCount.textContent = '';
    } else {
      resultCount.textContent = filtered.length + (filtered.length === 1 ? ' property' : ' properties');
    }
  }

  countySelect.addEventListener('change', render);
  sortSelect.addEventListener('change', render);
  resetBtn.addEventListener('click', function(){
    countySelect.value = 'all';
    sortSelect.value = '';
    render();
  });

  fetch(DATA_URL, { cache: 'no-store' })
    .then(function(res){ if (!res.ok) throw new Error('Not found'); return res.json(); })
    .then(function(data){
      allListings = (data && Array.isArray(data.listings)) ? data.listings : [];
      populateCounties();
      render();
    })
    .catch(function(){
      loadFailed = true;
      allListings = [];
      render();
    });
})();
</script>

</body>
</html>
