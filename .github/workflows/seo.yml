name: Static site SEO checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-seo.py
      - run: node --check assets/idx.js && node --check site.js && node --check resources/guide.js
