            pageAspectRatio: 0.6469849246231156,
            linkMap: {},
            tableOfContents: [{"title":"BUYINGA HOME","page":1,"level":0,"children":[{"title":"Shop for Homes Online:","page":1,"level":1,"children":[{"title":"www.HannahKeownHomes.com","page":1,"level":2}]},{"title":"Call or Text:","page":1,"level":1,"children":[{"title":"270-589-8376","page":1,"level":2}]}]},{"title":"Dear hopeful homeowner–","page":2,"level":0,"children":[{"title":"What’s","page":3,"level":1}]},{"title":"INSIDE","page":3,"level":0,"children":[{"title":"WHAT IT’S LIKE TO WORK WITH ME","page":3,"level":1},{"title":"HONEST ANSWERS TO YOUR QUESTIONS","page":3,"level":1},{"title":"THE STEP-BY-STEP BUYER ROADMAP","page":3,"level":1},{"title":"WHAT TO DO IF YOU’RE BUYING LATER","page":3,"level":1},{"title":"CHECKLISTS + TOOLS TO KEEP YOU ON TRACK","page":3,"level":1},{"title":"the","page":4,"level":1}]},{"title":"FAQS","page":4,"level":0,"children":[{"title":"HOW DO YOU GET PAID?","page":4,"level":1},{"title":"WHAT IF I’M NOT SURE IF I’M READY TO BUY?","page":4,"level":1},{"title":"HOW DO I KNOW WHAT I CAN AFFORD?","page":4,"level":1},{"title":"WHAT IF I HAVE A HOUSE I NEED TO SELL FIRST?","page":4,"level":1},{"title":"IS RIGHT NOW THE BEST TIME TO BUY?","page":4,"level":1},{"title":"the","page":5,"level":1}]},{"title":"ROADMAP","page":5,"level":0,"children":[{"title":"WHAT IT ACTUALLY LOOKS LIKE TO BUY A HOME.","page":5,"level":1},{"title":"Let’s talk goals","page":5,"level":1},{"title":"Get pre-approved + set your budget","page":5,"level":1},{"title":"Make it official","page":5,"level":1},{"title":"Start your home search","page":5,"level":1},{"title":"Make an offer + go under contract","page":5,"level":1},{"title":"Close + celebrate","page":5,"level":1}]},{"title":"Choose Your Agent","page":6,"level":0,"children":[{"title":"Choosing the real estate agent that you’ll work alongside to buy your home is not a decision to take lightly.","page":6,"level":1},{"title":"Your agent should have a deep understanding of your goals, your market, and a track record for working diligently on behalf of you, their client.","page":6,"level":1},{"title":"Credentials, of course, are a plus- but what you can’t see behind the numbers are the intangibles of always going the extra mile and genuinely caring deeply for clients.","page":6,"level":1},{"title":"I look forward to the opportunity of representing you and sharing this life milestone with you and your family.","page":6,"level":1}]},{"title":"Hannah Keown","page":6,"level":0,"children":[{"title":"CREDENTIALS","page":7,"level":1}]},{"title":"Hannah Keown","page":7,"level":0,"children":[{"title":"REALTOR®","page":7,"level":1,"children":[{"title":"270-589-8376","page":7,"level":2},{"title":"hannahkeownhomes@gmail.com","page":7,"level":2},{"title":"www.HannahKeownHomes.com","page":7,"level":2},{"title":"@HannahKeown_KYRealtor","page":7,"level":2,"children":[{"title":"ABOUT ME","page":7,"level":3}]}]},{"title":"What you can expect working with me","page":7,"level":1,"children":[{"title":"I'm Curious","page":7,"level":2},{"title":"I'm Committed","page":7,"level":2},{"title":"I'm Proactive","page":7,"level":2},{"title":"I'm Personal","page":7,"level":2}]}]},{"title":"The Value of a Buyer’s Agent","page":8,"level":0,"children":[{"title":"Exclusive Representation for Your Interests","page":8,"level":1},{"title":"Access to Off-Market Listings","page":8,"level":1},{"title":"In-Depth Market Insight","page":8,"level":1},{"title":"Skilled Negotiation on Your Behalf","page":8,"level":1},{"title":"Coordination of the Buying Process","page":8,"level":1},{"title":"Insider Advice on Property Potential and Pitfalls","page":8,"level":1}]},{"title":"Exclusive Buyer Brokerage Agreement","page":9,"level":0,"children":[{"title":"Attached is the Exclusive Buyer Brokerage Agreement. As of August 17th, 2024, this document is required to be signed for a buyer’s agent to show you homes and represent you in a real estate transaction. This agreement outlines our mutual responsibilities and ensures that you receive dedicated and professional service throughout your home-buying journey. Please review the document, and let me know if you have any questions or if you’re ready to proceed.","page":9,"level":1},{"title":"As your buyer’s agent, I will...","page":9,"level":1,"children":[{"title":"...negotiate for you","page":9,"level":2},{"title":"...guide you through the market","page":9,"level":2},{"title":"...scout off-market properties","page":9,"level":2},{"title":"...make it a seamless process","page":9,"level":2}]}]},{"title":"Hannah Keown","page":9,"level":0,"children":[{"title":"This isn’t my first rodeo...","page":10,"level":1}]},{"title":"150+","page":10,"level":0,"children":[{"title":"HOMES SOLD","page":10,"level":1}]},{"title":"9+","page":10,"level":0,"children":[{"title":"YEARS IN BUSINESS","page":10,"level":1}]},{"title":"60%","page":10,"level":0,"children":[{"title":"BUYER REPRESENTATION","page":10,"level":1}]},{"title":"100%","page":10,"level":0,"children":[{"title":"5-STAR REVIEWS","page":10,"level":1}]},{"title":"What Clients Are Saying","page":11,"level":0,"children":[{"title":"The experience with Hannah was awesome. Beyond Blessed to have Hannah as my Realtor. She was the best. Very understanding, communication was perfect she let us know every step of the way making the 30 days fly by. I would 100% recommend Hannah to be anyones realtor.","page":11,"level":1,"children":[{"title":"BAXTER FAMILY","page":11,"level":2},{"title":"BLEVINS FAMILIY","page":11,"level":2},{"title":"Hannah is out-going, takes initiative, and puts her clients first! We are military affiliated overseas and moving back to the States. Hannah has done an amazing job showing us houses virtually, answering our million questions, and going above and beyond! We felt supported throughout the entire process and she now feels like family!","page":11,"level":2,"children":[{"title":"MAIER FAMILY","page":11,"level":3}]}]}]},{"title":"Considerations for Buyers","page":12,"level":0,"children":[{"title":"JOB & INCOME","page":12,"level":1,"children":[{"title":"Do you have a stable job and income? Are you staying in this line of work? What are your expenses, savings, and debts?","page":12,"level":2}]},{"title":"CREDIT SCORE","page":12,"level":1,"children":[{"title":"A credit score of 620 is typically required for conventional loans, while FHA has more flexibility depending on down payment.","page":12,"level":2}]},{"title":"DOWN PAYMENT","page":12,"level":1,"children":[{"title":"Depending on loan type, your down payment can range from 0%-20% of the purchase price.","page":12,"level":2}]},{"title":"CLOSING COSTS","page":12,"level":1,"children":[{"title":"Closing costs range from 2-6% of the loan amount. Other fees include inspection and appraisal costs.","page":12,"level":2}]},{"title":"LONG TERM PLANNING","page":12,"level":1,"children":[{"title":"Do you plan to stay in this location? Do you foresee major life changes? Consider how your career, family, and lifestyle might evolve over time.","page":12,"level":2}]},{"title":"ONGOING COSTS","page":12,"level":1,"children":[{"title":"As a homeowner, your budget should factor in your monthly mortgage payments, property taxes, homeowner’s insurance, & maintenance costs (roughly 1%-2% of purchase price per year). Ask your loan officer to include this cost into your monthly payment.","page":12,"level":2}]}]},{"title":"The “Just Browsing” Buyer Blueprint","page":13,"level":0,"children":[{"title":"Buying later doesn’t mean you have to wait to get organized. In fact, this is the best time to lay the groundwork so when you're ready, you're not starting from scratch — you’re ready to move.","page":13,"level":1},{"title":"Check your credit score and work on improving it (ideally 700+ for best loan options)","page":13,"level":1},{"title":"Open a high-yield savings account (HYSA) and start putting aside money for your down payment (if needed), closing costs, and moving expenses","page":13,"level":1},{"title":"Use a home budget calculator to get a ballpark of your budget","page":13,"level":1},{"title":"Explore neighborhoods and get clear on your lifestyle must-haves","page":13,"level":1},{"title":"Set up a VIP Home Search with me so you can watch the market in real time and learn what your money can get you","page":13,"level":1,"children":[{"title":"STEP THREE","page":14,"level":2}]}]},{"title":"The Mortgage Process","page":14,"level":0,"children":[{"title":"Let’t talk finances","page":14,"level":1,"children":[{"title":"The next step of the home buying process is to understand how much you qualify for by meeting with a local lender and getting a pre-approval letter.","page":14,"level":2,"children":[{"title":"It's important to speak with a few lenders to find the right fit! Grab my lender interview questions on the next page. Plus, I’ve provided a few trusted lenders below so you can fill out a loan application online! It will only take 20 min of your time. Reach out to me if you have questions.","page":14,"level":3},{"title":"Remember that a pre-approval is only valid for 30-90 days, so while you can start reaching out to lenders, you’ll want to secure that pre-approval letter closer to when you’re ready to buy.","page":14,"level":3}]},{"title":"Alex Turner |","page":14,"level":2},{"title":"812-461-8213","page":14,"level":2},{"title":"www.interlincmortgage.com/alex-turner","page":14,"level":2},{"title":"Dennie Dowell |","page":14,"level":2},{"title":"270-317-3283","page":14,"level":2},{"title":"www.Northpoint.com/homelending/getstarted/Dennie-Dowell/","page":14,"level":2},{"title":"Kyle Turpin |","page":14,"level":2},{"title":"502-693-3145","page":14,"level":2},{"title":"www.kyleturpin.supremelendinglo.com","page":14,"level":2}]}]},{"title":"The Home Loan","page":15,"level":0,"children":[{"title":"HOW MUCH DO I NEED TO SAVE UP FOR A DOWN PAYMENT?","page":15,"level":1,"children":[{"title":"My lenders will try to approve you with 0% down. However, 3% is a good place to start. The average first time buyer puts down 7%. You can work with a mortgage lender to play around with numbers and see how your downpayment amount offsets your monthly payment, and especially with how PMI works.","page":15,"level":2}]},{"title":"HOW DO I KNOW IF I QUALIFY AND HOW MUCH I CAN AFFORD?","page":15,"level":1,"children":[{"title":"Contact a mortgage lender to get pre-approval for a loan. The lender will ask you some basic questions about your income and debts and can tell you what amount you can be approved for, and how much your mortgage payments will be.","page":15,"level":2}]},{"title":"WHAT DOES THE LENDER NEED FROM ME TO GIVE ME A LOAN?","page":15,"level":1,"children":[{"title":"Usually, you are asked to provide your last two tax returns to show proof of income. You should also provide recent bank and credit card statements and proof of your current pay. You will also be asked for your SSN so they can run a credit check.","page":15,"level":2}]},{"title":"WHAT'S THE DIFFERENCE BETWEEN PRE-APPROVED AND PRE-QUALIFIED?","page":15,"level":1,"children":[{"title":"While often used interchangeably, these terms don’t mean the same thing. Pre-qualification is an estimate of what you may be approved for based only on the verbal information you provide. Pre-approval means the lender has verified your income and debt information and run a credit check.","page":15,"level":2}]},{"title":"HOW DO I KNOW WHICH MORTGAGE OPTION IS RIGHT FOR ME?","page":15,"level":1,"children":[{"title":"Your mortgage lender is the best person to advise you on this question. Their products and qualifications change from time to time, so they would know best what products are available to meet your needs.","page":15,"level":2}]},{"title":"DO YOU HAVE A MORTGAGE LENDER I CAN TALK TO?","page":15,"level":1,"children":[{"title":"Yes, absolutely! I have a few that I work with that I can happily refer to you. Just ask and I'll connect you. You are welcome to use your own if you have someone in mind as well.","page":15,"level":2}]},{"title":"WHEN SHOULD I GET PRE-APPROVED?","page":15,"level":1,"children":[{"title":"About 3-6 months out from when you'd like to move. If that has already passed, no worries! Pre-approvals only take about 2-3 days, you just want to have that pre-approval before you begin shopping.","page":15,"level":2}]}]},{"title":"Lender Questionnaire","page":16,"level":0,"children":[{"title":"What type of loan do you recommend for me and why?","page":16,"level":1},{"title":"Do I qualify for down payment assistance programs?","page":16,"level":1},{"title":"What is the interest rate? What is the APR?","page":16,"level":1},{"title":"Will I pay mortgage insurance?","page":16,"level":1},{"title":"What will my monthly payment be?","page":16,"level":1},{"title":"Can I lock in an interest rate? If so for how long? Are there fees associated?","page":16,"level":1},{"title":"What will my closing costs be? Are they a part of my loan, or will I pay them at closing?","page":16,"level":1,"children":[{"title":"STEP FOUR","page":17,"level":2}]}]},{"title":"Wants vs. Needs","page":17,"level":0,"children":[{"title":"Before we hop into the home search, I advise my clients to create a \"Needs\" list and a \"Wants\" list. This will help us to focus on the things that are most important in your future home.","page":17,"level":1},{"title":"\"Needs\" are the non-negotiable features. \"Wants\" are the nice-to-haves, but you can live without or add down the road. Remember you can't change the lot, the location, or the price you paid.","page":17,"level":1},{"title":"✓ Enough bedrooms for your family","page":17,"level":1},{"title":"✓ First floor master bedroom","page":17,"level":1},{"title":"✓ Close proximity to work or school","page":17,"level":1},{"title":"✓ Attached two-car garage","page":17,"level":1},{"title":"✓ Yard for children or pets","page":17,"level":1},{"title":"✓ Specific paint or exterior color","page":17,"level":1},{"title":"✓ Fenced-in backyard","page":17,"level":1},{"title":"✓ Specific flooring","page":17,"level":1},{"title":"✓ Kitchen amenities or appliances","page":17,"level":1},{"title":"✓ Walk-in shower or double vanity","page":17,"level":1,"children":[{"title":"STEP FIVE","page":18,"level":2}]}]},{"title":"The Home Search Process","page":18,"level":0,"children":[{"title":"FIRST THINGS FIRST","page":18,"level":1},{"title":"Now that you’ve got your “Wants vs. Needs” list in hand, the fun really begins! I will set you up on a search so you’ll receive an email the minute a property that fits your criteria hits the market.","page":18,"level":1,"children":[{"title":"WANT TO DO SOME ONLINE SEARCHING YOURSELF?","page":18,"level":2}]},{"title":"Use the search filters, but don’t go crazy. Expand your geographic search, and add $5k - $12k to your max price.","page":18,"level":1},{"title":"If a home you like is “pending” or “under contract”don’t panic! Pending contracts fall through occasionally so keep it on your list, especially if it checks all your boxes.","page":18,"level":1},{"title":"Jot down the MLS number & address. Send this information to me and I will call the listing agent to gather pertinent info.","page":18,"level":1}]},{"title":"The Home Search","page":19,"level":0,"children":[{"title":"WHAT SHOULD I DO WHEN I SEE A HOUSE ONLINE THAT I LIKE?","page":19,"level":1,"children":[{"title":"Text me, your buyer’s agent: the agent you are working with to find your home. It’s best that you work with one real estate agent throughout your search. That agent learns what you like and dislike and will invest a lot of time vetting properties for you. That person also represents your best interests only. When you call the agent advertising the home, you are dealing with the seller’s agent, so, while they can assist you, they are also representing the seller’s best interest.","page":19,"level":2}]},{"title":"CAN YOU SHOW ME A HOUSE IF IT'S NOT YOUR LISTING?","page":19,"level":1,"children":[{"title":"Absolutely. As a buyer’s agent, I can show you any house listed, and I will contact FSBO sellers on your behalf. As mentioned above, working with me as your buyer’s agent ensures that your best interests are protected.","page":19,"level":2}]},{"title":"HOW DO WE WRITE AN OFFER?","page":19,"level":1,"children":[{"title":"When you find the property you want to make an offer on, I will run a Comparative Market Analysis (CMA) to help you determine a fair offer amount. I will also guide you through the additional terms of the contract, such as the escrow amount, closing date, and any additional terms you want to be added to the offer. I will write the offer on a contract form and submit it to the seller’s agent.","page":19,"level":2}]},{"title":"WHAT IF I WANT TO BACK OUT OF A CONTRACT?","page":19,"level":1,"children":[{"title":"Once you are under contract, there is no recision period. When the contract is contingent on a property inspection, you usually have the right to cancel for major required repairs during the inspection period. Once the inspection period has passed, you cannot back out and keep your deposit unless the seller agrees, or an additional term has not been met.","page":19,"level":2}]},{"title":"WHAT HAPPENS IF THERE ARE OTHER OFFERS ON THE HOUSE I LOVE?","page":19,"level":1,"children":[{"title":"If a seller receives multiple offers on their home, usually their agent will inform the buyer’s that multiple offers have been received and the buyers have another opportunity to alter their original offer to present their “best and final” offer. Keep in mind that many factors may influence the seller in addition to the offer price, such as the down payment amount, closing date, and inspection terms.","page":19,"level":2}]},{"title":"WHAT HAPPENS WHEN MY OFFER GETS ACCEPTED?","page":19,"level":1,"children":[{"title":"Once both parties have agreed on all terms and signed the contract, your escrow deposit must be made and I schedule the home inspection. Your lender will receive a copy of the contract and will begin processing your mortgage application.","page":19,"level":2}]},{"title":"STEP SIX","page":20,"level":1}]},{"title":"Showings","page":20,"level":0,"children":[{"title":"✓  Read over your Wants vs. Needs list and revisit your budget. Having this fresh on your mind will help you stay objective and focused.","page":20,"level":1},{"title":"✓  Utilize Google Street View.","page":20,"level":1,"children":[{"title":"This is a great way to take a virtual walk around the neighborhood.","page":20,"level":2},{"title":"✓  Take pictures and videos. This will help you to jog your memory later.","page":20,"level":2},{"title":"✓  Consider the lot, lot size, and location. All of these things can’t be changed.","page":20,"level":2}]},{"title":"✓  Look past decor & staging.","page":20,"level":1,"children":[{"title":"These things will soon be gone.","page":20,"level":2}]},{"title":"✓  Structural integrity","page":20,"level":1,"children":[{"title":"Look for signs of structural integrity. Water damage, cracks in walls or ceilings, sloping floors.","page":20,"level":2}]},{"title":"✓  Noise levels","page":20,"level":1,"children":[{"title":"From nearby roads, businesses,","page":20,"level":2},{"title":"airports and railways.","page":20,"level":2}]},{"title":"✓  Roof & water damage","page":20,"level":1,"children":[{"title":"Check for leaks near plumbing sources, water stains on the ceiling, or damage to siding, windows, and doors.","page":20,"level":2}]},{"title":"✓  Layout and flow","page":20,"level":1,"children":[{"title":"Does the property's layout suit your lifestyle? Would it require renovations? Check room sizes, storage, and flow between rooms.","page":20,"level":2}]}]},{"title":"Showing Checklist","page":21,"level":0,"children":[{"title":"ADDRESS","page":21,"level":1},{"title":"LIST 3 PROS OF THE HOME:","page":21,"level":1},{"title":"LIST 3 CONS OF THE HOME:","page":21,"level":1,"children":[{"title":"TOOK VIDEOS / PHOTOS","page":21,"level":2},{"title":"INITIAL REACTION (CIRCLE)","page":21,"level":2},{"title":"YES","page":21,"level":2},{"title":"NO","page":21,"level":2},{"title":"NO","page":21,"level":2},{"title":"MAYBE","page":21,"level":2},{"title":"VERY INTERESTED","page":21,"level":2},{"title":"IT’S THE ONE!","page":21,"level":2}]},{"title":"ADDRESS","page":21,"level":1},{"title":"LIST 3 PROS OF THE HOME:","page":21,"level":1},{"title":"LIST 3 CONS OF THE HOME:","page":21,"level":1,"children":[{"title":"TOOK VIDEOS / PHOTOS","page":21,"level":2},{"title":"INITIAL REACTION (CIRCLE)","page":21,"level":2},{"title":"YES","page":21,"level":2},{"title":"NO","page":21,"level":2},{"title":"NO","page":21,"level":2},{"title":"MAYBE","page":21,"level":2},{"title":"VERY INTERESTED","page":21,"level":2},{"title":"IT’S THE ONE!","page":21,"level":2,"children":[{"title":"STEP SEVEN","page":22,"level":3}]}]}]},{"title":"Writing your Offer","page":22,"level":0,"children":[{"title":"So you think you’ve found “the one” and you’re ready to put in an offer. Woohoo!","page":22,"level":1},{"title":"Let's talk about making an offer that truly stands out. Below are my tried and tested recommendations.","page":22,"level":1},{"title":"We’ll include your pre-approval letter. This letter shows that you’re serious, qualified, and ready to purchase.","page":22,"level":1},{"title":"We’ll gather information about what the seller is looking for. Understanding their needs and motivations will be a big part of writing a great offer.","page":22,"level":1},{"title":"We’ll put your best foot—and price—forward. In a competitive market, you may only get one shot, so we will make it count! We’ll use comps and trends as a guide.","page":22,"level":1},{"title":"We’ll propose to close quickly.","page":22,"level":1,"children":[{"title":"Offering a shorter closing timeline will signal to the seller we have a serious offer and we’re ready to move fast.","page":22,"level":2}]}]},{"title":"Purchase price","page":23,"level":0,"children":[{"title":"This is the amount you’re offering to pay for the home. It's often negotiable, especially if there are multiple offers, the home needs repairs, or if the home has been on the market for a while.","page":23,"level":1}]},{"title":"Earnest money deposit","page":23,"level":0,"children":[{"title":"This is a good faith deposit showing your serious intent to buy. It’s typically 1-3% of the purchase price and is held in escrow. If the sale goes through, the deposit is applied to your down payment or closing costs. If you back out without a valid contingency, you might forfeit the deposit.","page":23,"level":1}]},{"title":"Inspection period","page":23,"level":0,"children":[{"title":"Most buyers include a home inspection contingency, allowing time (usually 7-10 days) to hire an inspector to check the home’s condition. If major issues are found, we can negotiate repairs or back out of the deal.","page":23,"level":1}]},{"title":"Contingencies","page":23,"level":0,"children":[{"title":"A contingency is a condition that must be met before a buyer and seller can finalize the purchase of a home.","page":23,"level":1},{"title":"A financing contingency protects you in the case that you are not able to secure a mortgage. If your loan falls through, you can back out without penalty. An appraisal contingency ensures the home appraises for at least the amount of your offer. If it doesn’t, you can renegotiate or walk away. An inspection contingency allows you to renegotiate or cancel the offer if the home inspection reveals significant issues.","page":23,"level":1}]},{"title":"Closing costs","page":23,"level":0,"children":[{"title":"These include lender fees, title insurance, taxes, and other costs associated with finalizing the sale. Closing costs can range from 2-5% of the purchase price.","page":23,"level":1}]},{"title":"Closing date","page":23,"level":0,"children":[{"title":"This is the date you and the seller agree to finalize the transaction and transfer ownership. This is usually 30-45 days from when the offer is accepted but can vary based on financing or other factors. We will ask for the keys at closing!","page":23,"level":1,"children":[{"title":"STEP EIGHT","page":24,"level":2}]}]},{"title":"We’re Under Contract!","page":24,"level":0,"children":[{"title":"Provide Escrow Deposit","page":24,"level":1},{"title":"Schedule Inspection","page":24,"level":1},{"title":"Finalize Loan Application","page":24,"level":1},{"title":"Secure Insurance","page":24,"level":1},{"title":"Order Appraisal","page":24,"level":1},{"title":"Title Search","page":24,"level":1},{"title":"Final Walkthrough","page":24,"level":1},{"title":"Closing Day","page":24,"level":1,"children":[{"title":"FIRST TIME HOME BUYER FAQ","page":25,"level":2}]}]},{"title":"Under Contract","page":25,"level":0,"children":[{"title":"WHAT DOES \"UNDER CONTRACT\" MEAN?","page":25,"level":1,"children":[{"title":"Under contract means that all parties have agreed on terms, have signed the contract, and the signed contract has been delivered to both buyer and seller. The escrow money will need to be deposited within 3 days of accepted contract.","page":25,"level":2}]},{"title":"WHAT IS EMD?","page":25,"level":1,"children":[{"title":"The earnest money deposit is money that is offered with an offer, or as soon as an offer is accepted, to show the seller that you are serious about moving forward with the purchase of the home. Because you forfeit this deposit if you back out of the purchase for any reason not allowed for in the contract, the larger the escrow deposit, the more seriously your offer is taken. This deposit is part of your downpayment, not in addition to.","page":25,"level":2}]},{"title":"DO I NEED AN INSPECTION?","page":25,"level":1,"children":[{"title":"I always recommend that you have a home inspection done. In the scheme of things, paying a few hundred dollars to have peace of mind that there are no hidden dangers or problems is well worth the money.","page":25,"level":2}]},{"title":"HOW MUCH ARE INSPECTIONS?","page":25,"level":1,"children":[{"title":"The cost of the home inspection depends on the size of the house and additional inspections requested, such as swimming pool, septic tank, termites, insurance four-point (HVAC, plumbing, roof, and electrical,) and radon. An average home inspection, without additional inspections, is about $350-$600.","page":25,"level":2}]},{"title":"WHAT IF MY LOAN DOESN'T GET APPROVED?","page":25,"level":1},{"title":"WHEN CAN I START MOVING?","page":25,"level":1,"children":[{"title":"When you have the keys! When you are financing your purchase, it takes about 3-4 weeks for your loan to be processed. Once the lender gives the all-clear, closing is scheduled. You will sign your loan documents and both parties will sign documents transferring ownership to you. Unless other arrangements have been agreed upon by both parties, the sellers should have completely vacated the home when they sign the closing papers. You can have your belongings ready to move, and a moving company scheduled before you go to closing.","page":25,"level":2}]}]},{"title":"Under Contract Checklist","page":26,"level":0,"children":[{"title":"Send Escrow Deposit","page":26,"level":1,"children":[{"title":"Escrow deposit amount:","page":26,"level":2},{"title":"Escrow deposit recipient:","page":26,"level":2,"children":[{"title":"Be very careful when wiring funds.","page":26,"level":3},{"title":"Never trust wiring instructions sent via email.","page":26,"level":3}]}]},{"title":"Begin Loan Application","page":26,"level":1},{"title":"Schedule Inspections","page":26,"level":1,"children":[{"title":"The last day to renegotiate or cancel the contract due to issues revealed by the inspections is:","page":26,"level":2}]},{"title":"Obtain Home Insurance","page":26,"level":1,"children":[{"title":"Contact insurance companies for quotes before the end of the inspection period.","page":26,"level":2}]}]},{"title":"Important Dates","page":26,"level":0,"children":[{"title":"EXECUTED CONTRACT DATE","page":26,"level":1},{"title":"ESCROW DEPOSIT DUE","page":26,"level":1},{"title":"LOAN APPLICATION DUE","page":26,"level":1},{"title":"INSPECTION PERIOD ENDS","page":26,"level":1},{"title":"ESTIMATED CLOSING DAY","page":26,"level":1},{"title":"HOME","page":26,"level":1},{"title":"ADDRESS","page":26,"level":1},{"title":"TITLE","page":26,"level":1},{"title":"COMPANY","page":26,"level":1},{"title":"PURCHASE PRICE","page":26,"level":1},{"title":"ESCROW","page":26,"level":1},{"title":"DEPOSIT","page":26,"level":1,"children":[{"title":"STEP NINE","page":27,"level":2}]}]},{"title":"Inspections & Insurance","page":27,"level":0,"children":[{"title":"WHAT’S A HOME INSPECTION?","page":27,"level":1},{"title":"The inspection will uncover any issues in the home that would have otherwise been unknown. You will receive a written report of the inspection. I recommend that you are present for the inspection, so that you may ask any questions.","page":27,"level":1,"children":[{"title":"DO I REALLY NEED AN INSPECTION?","page":27,"level":2}]},{"title":"The home may appear to be in perfect shape, but some of the costliest problems are difficult to spot: leaks, termite damage, foundation issues, poor ventilation, faulty wiring, and leaking appliances.","page":27,"level":1,"children":[{"title":"WHAT IS THE INSPECTION PERIOD?","page":27,"level":2}]},{"title":"Typically, inspection periods can last anywhere from 7 to 10 days. During this time, the buyer has the right to hire a professional to inspect the condition of the home.","page":27,"level":1,"children":[{"title":"THE INSPECTION REVEALED ISSUES...","page":27,"level":2},{"title":"WHEN SHOULD I SCHEDULE IT?","page":27,"level":2},{"title":"WHAT ABOUT HOME INSURANCE?","page":27,"level":2}]},{"title":"Once you have a signed contract, start looking for insurance providers immediately. Your lender will typically require evidence of insurance coverage before they approve your mortgage. Gather multiple quotes!","page":27,"level":1}]},{"title":"Inspections Cheat Sheet","page":28,"level":0,"children":[{"title":"STANDARD","page":28,"level":1,"children":[{"title":"$500.00","page":28,"level":2}]},{"title":"FOUR-POINT","page":28,"level":1,"children":[{"title":"$350","page":28,"level":2}]},{"title":"WDO","page":28,"level":1,"children":[{"title":"$75","page":28,"level":2}]},{"title":"LEAD-BASED PAINT","page":28,"level":1},{"title":"VARIES","page":28,"level":1},{"title":"Trusted Inspection Companies","page":28,"level":1,"children":[{"title":"ABOVE & BEYOND HOME INSEPCTIONS","page":28,"level":2},{"title":"KNOW BEFORE YOU BUY","page":28,"level":2},{"title":"BEST VALUE HOME INSPECTION","page":28,"level":2,"children":[{"title":"Paul Wells","page":28,"level":3},{"title":"270-268-0389","page":28,"level":3}]}]}]},{"title":"Home Insurance Cheat Sheet","page":29,"level":0,"children":[{"title":"HOMEOWNERS","page":29,"level":1},{"title":"The standard homeowners insurance covers financial protection against loss due to disasters, theft and accidents.","page":29,"level":1,"children":[{"title":"HAZARD","page":29,"level":2}]},{"title":"Hazard insurance protects against damage caused by fires, severe storms, hail/sleet, or other natural events.","page":29,"level":1,"children":[{"title":"FLOOD","page":29,"level":2}]},{"title":"Flood insurance protects against damage caused by a flood.","page":29,"level":1,"children":[{"title":"WINDSTORM","page":29,"level":2}]},{"title":"Wind insurance protects against damage caused by tornadoes, hurricanes, or gales.","page":29,"level":1},{"title":"Trusted Insurance Companies","page":29,"level":1,"children":[{"title":"HOOVER MAJORS INSURANCE","page":29,"level":2,"children":[{"title":"Dani Saltsman","page":29,"level":3},{"title":"270-259-6141","page":29,"level":3},{"title":"dani@hoovermajors.com","page":29,"level":3}]},{"title":"CARTER HARRELL","page":29,"level":2},{"title":"STATE FARM","page":29,"level":2},{"title":"SHELTER INSURANCE","page":29,"level":2,"children":[{"title":"Daniel Mudd","page":29,"level":3},{"title":"270-259-0327","page":29,"level":3},{"title":"Donna Vanmeter","page":29,"level":3},{"title":"270-259-4488","page":29,"level":3},{"title":"dvanmeter@shelterinsurance.com","page":29,"level":3}]}]},{"title":"Pre-Closing Checklist","page":30,"level":1,"children":[{"title":"Under contract","page":30,"level":2},{"title":"Inspections","page":30,"level":2},{"title":"Obtain home insurance","page":30,"level":2}]}]},{"title":"TIP","page":30,"level":0,"children":[{"title":"Order Appraisal","page":30,"level":1},{"title":"Obtain Mortgage","page":30,"level":1,"children":[{"title":"You have 1 day from the date of contract execution to begin the mortgage loan application. During the 30-45 days before closing, your lender will be finalizing the loan.","page":30,"level":2}]},{"title":"Conduct Survey","page":30,"level":1,"children":[{"title":"Unless a recent survey of the property exists, a recent one may be requested. The survey is a sketch showing a map of the property lines and boundaries and reveals if there are any encroachments on the property. The survey is ordered by the title company and paid for by the buyer.","page":30,"level":2}]},{"title":"Title Search","page":30,"level":1,"children":[{"title":"The title company will conduct a title search to ensure the property is legitimate and that there are no outstanding mortgage liens, judgments, easements, leases, unpaid taxes, or other restrictions that would impact your ownership.","page":30,"level":2},{"title":"Once the title is found to be valid, the title company will issue a title insurance policy which protects lenders or owners against claims or legal fees that may arise over ownership of the property. This will be included in closing costs.","page":30,"level":2}]},{"title":"Clear to Close","page":30,"level":1,"children":[{"title":"The magic words! This phrase means the mortgage underwriter has officially approved all documentation required to fund the loan. All that remains is the actual closing process.","page":30,"level":2}]}]},{"title":"Closing Time!","page":31,"level":0,"children":[{"title":"We’ve completed all the pre-closing steps. High five! Here's a quick rundown on what you can expect from the closing process and closing day.","page":31,"level":1},{"title":"Loan Approval","page":31,"level":1,"children":[{"title":"After the appraisal and inspection, your lender will finalize your loan. You’ll hear the magic words “Clear to close!”","page":31,"level":2}]},{"title":"Review Closing Disclosure","page":31,"level":1,"children":[{"title":"You will receive a closing disclosure from your lender at least three days before closing. It outlines the final terms of your loan, including the interest rate, loan amount, and closing costs. Review it carefully - this will tell you the funds to bring on closing day.","page":31,"level":2}]},{"title":"Arrange Utilities Transfer","page":31,"level":1,"children":[{"title":"Contact utility providers to set up services like electricity, gas, water, and internet for the day of closing or move-in day. They may require “Proof of Ownership.” In that case, bring your closing disclosure when setting them up.","page":31,"level":2}]},{"title":"Obtain","page":31,"level":1},{"title":"Certified Funds","page":31,"level":1,"children":[{"title":"You’ll need to bring certified funds (cashier’s check or wire transfer) for your down payment and closing costs. Your closing agent will provide you with the exact amount a few days before closing.","page":31,"level":2}]},{"title":"CASH TO CLOSE","page":32,"level":1}]},{"title":"Down Payment Costs","page":32,"level":0,"children":[{"title":"This is the amount you are contributing toward the purchase price. The exact amount depends on your loan type (often between 3% and 20%). Although there are programs that will cover your down payment if you qualify.","page":32,"level":1}]},{"title":"Closing Costs","page":32,"level":0,"children":[{"title":"Loan Origination Fees: Charged by the lender for processing your mortgage application -  typically 0.5%-1% of the loan amount.","page":32,"level":1},{"title":"Discount Points: These are optional fees paid to lower your interest rate.","page":32,"level":1},{"title":"Appraisal Fee: This typically costs around $500-$700.","page":32,"level":1},{"title":"Credit Report Fee: The lender charges this for checking your credit, typically $25-$50.","page":32,"level":1},{"title":"Underwriting Fee: Lender charges for evaluating your loan, typically $400-$1,000.","page":32,"level":1},{"title":"Title Search Fee: The cost of a title company researching the property's history to ensure there are no liens or claims - usually $150-$400.","page":32,"level":1},{"title":"Title Insurance: Protects you and your lender against future claims on the property’s title -  usually 0.5%-1% of the purchase price.","page":32,"level":1},{"title":"Escrow/Settlement Fee: Paid to the title company or attorney handling the closing - usually $500-$1,000.","page":32,"level":1}]},{"title":"Prepaids","page":32,"level":0,"children":[{"title":"Homeowner’s Insurance Premium: You typically pay the first year’s premium upfront","page":32,"level":1},{"title":"Property Taxes: Lenders may require 2-3 months of property taxes to be pre-paid into an escrow account. This ensures funds are available when the tax bill is due.","page":32,"level":1},{"title":"Prepaid Interest: Interest that accrues on your loan from the closing date until the first mortgage payment, based on the closing date and loan terms.","page":32,"level":1},{"title":"Private Mortgage Insurance (PMI): If your down payment is less than 20%, you may need to pay upfront mortgage insurance premiums.","page":32,"level":1}]},{"title":"Total Expected Cash to Bring","page":32,"level":0,"children":[{"title":"On average, closing costs range from 2%-5% of the purchase price of the home. This includes loan costs, pre-paids, and title fees.","page":32,"level":1},{"title":"You will receive a closing disclosure from your lender at least three days before closing, detailing the exact amount of cash you need to bring.","page":32,"level":1},{"title":"Use a certified check or wire transfer for the funds, as personal checks are typically not accepted at closing.","page":32,"level":1},{"title":"FIRST TIME HOME BUYER FAQ","page":33,"level":1}]},{"title":"Vocab to Know","page":33,"level":0,"children":[{"title":"ACTIVE","page":33,"level":1},{"title":"ADJUSTABLE-RATE MORTGAGE (ARM)","page":33,"level":1},{"title":"EXPIRED","page":33,"level":1},{"title":"FIXED-RATE MORTGAGE","page":33,"level":1},{"title":"BACK ON MARKET","page":33,"level":1},{"title":"CLOSING COSTS","page":33,"level":1},{"title":"CONTINGENCY","page":33,"level":1},{"title":"FSBO","page":33,"level":1},{"title":"INTEREST","page":33,"level":1},{"title":"MLS","page":33,"level":1},{"title":"DOWN PAYMENT","page":33,"level":1},{"title":"PENDING","page":33,"level":1},{"title":"PART TWO","page":34,"level":1}]},{"title":"Congratulations, New Homeowner!","page":34,"level":0},{"title":"Next Steps","page":35,"level":0,"children":[{"title":"Whether you’re ready to start touring homes or just getting your finances in order, here’s how we can work together:","page":35,"level":1},{"title":"We’ll book a quick intro call to talk timing, goals, and next steps.","page":35,"level":1},{"title":"I’ll set up your custom VIP Home Search.","page":35,"level":1},{"title":"I’ll send over prep tools based on where you are in the buying process.","page":35,"level":1},{"title":"We’ll go at your pace — whether that means looking now or prepping for later.","page":35,"level":1,"children":[{"title":"SCHEDULE A 30 MIN CALL","page":35,"level":2}]},{"title":"Your next move starts here — and I’ll guide you the whole way.","page":35,"level":1},{"title":"Hannah Keown","page":35,"level":1,"children":[{"title":"270-589-8376","page":35,"level":2},{"title":"HANNAHKEOWNHOMES@GMAIL.COM","page":35,"level":2},{"title":"WWW.HANNAHKEOWNHOMES.COM","page":35,"level":2}]}]},{"title":"THANK YOU","page":36,"level":0,"children":[{"title":"Thank you for trusting me with your home search. I'm here for any questions or concerns you have about your new home. If you're satisfied with my service, reviews and referrals are greatly appreciated.","page":36,"level":1},{"title":"Hannah Keown","page":36,"level":1,"children":[{"title":"Please help my business grow!","page":36,"level":2,"children":[{"title":"WRITE A REVIEW","page":36,"level":3},{"title":"FOLLOW ALONG","page":36,"level":3}]}]}]}],
